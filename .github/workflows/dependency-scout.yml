name: Dependency Scout

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  dependency-scout:
    runs-on: ubuntu-latest
    name: Check for safe dependency updates
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for security vulnerabilities
        run: |
          echo "=== Security Audit ==="
          npm audit --audit-level=moderate || true

      - name: Check for patch/minor updates
        run: |
          echo "=== Available Safe Updates ==="
          npx npm-check-updates --target patch --format group || true

      - name: Create update branch if updates available
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="agent/dependency-updates-$DATE"

          # Check if there are any patch updates
          UPDATES=$(npx npm-check-updates --target patch --jsonAll 2>/dev/null || echo '{}')

          if [ "$UPDATES" = "{}" ] || [ -z "$UPDATES" ]; then
            echo "No patch updates available. Nothing to do."
            exit 0
          fi

          git config user.name "Dependency Scout Agent"
          git config user.email "agent@thepagegalleryjournal.com"
          git checkout -b "$BRANCH"

          # Apply only patch updates
          npx npm-check-updates --target patch -u
          npm install

          git add package.json package-lock.json
          git commit -m "chore(deps): patch dependency updates $DATE [agent/dependency-scout]"
          git push origin "$BRANCH"

          echo "Branch $BRANCH pushed. Open a PR to review."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
